services:
  postgres:
    image: postgres:16-alpine
    container_name: atlasrh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlasrh}
      POSTGRES_USER: ${POSTGRES_USER:-atlasrh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlasrh}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - atlasrh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  atlasrh-postgres-data:
